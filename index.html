<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源下载中心</title>
<style>
  :root {
    /* 背景图片：把 bg.jpg 放在同目录，或改成你的图片链接 */
    --bg-image: url('bg.png');

    --card-bg: rgba(255, 255, 255, 0.78);
    --card-border: rgba(255, 255, 255, 0.65);
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* 背景图 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: var(--bg-image);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
    transform: scale(1.02);
  }

  /* 背景遮罩，让文字更清晰 */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(
      135deg,
      rgba(15, 23, 42, 0.58),
      rgba(15, 23, 42, 0.28)
    );
    z-index: -1;
  }

  .container {
    width: 100%;
    max-width: 620px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 36px 32px;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header h1 {
    font-size: 28px;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .header p {
    color: var(--muted);
    font-size: 14px;
  }

  .file-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .file-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px;
    background: rgba(255, 255, 255, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 16px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .file-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    background: rgba(255, 255, 255, 0.88);
  }

  .file-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, #dbeafe, #bfdbfe);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  .file-info {
    flex: 1;
    min-width: 0;
  }

  .file-name {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-meta {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  .download-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .download-btn:hover {
    background: var(--primary-hover);
    transform: scale(1.03);
  }

  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 520px) {
    .container {
      padding: 24px 18px;
      border-radius: 18px;
    }

    .header h1 {
      font-size: 22px;
    }

    .file-item {
      padding: 14px;
      gap: 10px;
    }

    .file-icon {
      width: 40px;
      height: 40px;
      font-size: 20px;
    }

    .download-btn {
      padding: 8px 14px;
      font-size: 12px;
    }
  }
</style>
</head>
<body>

<main class="container">
  <div class="header">
    <h1>资源下载中心</h1>
    <p>点击下方按钮即可下载文件</p>
  </div>

  <div class="file-list">
    <div class="file-item">
      <div class="file-icon">📦</div>
      <div class="file-info">
        <div class="file-name">课件.pdf</div>
        <div class="file-meta">ZIP 压缩包 · 12.4 MB</div>
      </div>
      <a class="download-btn" href="https://d.tmpfile.link/public/2026-09-28/cc4505bc-ee8d-4301-9134-3e6a38fa5f8e/《乡土中国》推荐——读懂差序格局.pdf" download>下载</a>
    </div>
  </div>

  <div class="footer">© 2025 我的下载站 · 文件仅供个人学习使用</div>
</main>

</body>
</html>
